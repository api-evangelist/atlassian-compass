specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Atlassian Compass
providerId: atlassian-compass
generated: '2026-09-06'
method: searched
source: https://www.atlassian.com/software/compass/pricing
created: '2026-05-04'
modified: '2026-09-06'
description: >
  Published Compass subscription tiers, read from Atlassian's own pricing page on 2026-09-06. This
  file replaces a 2026-05-04 scaffold whose limits and prices were bulk-sweep defaults, not
  provider-published values. Compass is priced per full user per month; API access is included with
  the subscription and is not metered or sold separately, so there is no per-call price to record.
  Prices shown are the monthly-billing figures in USD.
tags:
- Atlassian
- Component Management
- Developer Experience
- Software Catalog
- GraphQL
plan_count: 3
currency: USD
billing:
  periods:
  - monthly
  annual_available: false
  annual_note: Atlassian states subscriptions to Compass are currently only available as monthly
    payments and that annual subscriptions are planned.
  currencies:
  - USD
  currency_note: Atlassian states payment for Compass is accepted only in US dollars at this time.
  payment_methods:
  - MasterCard
  - Visa
  - American Express
  money_back_guarantee_days: 30
  trial:
    plan: Standard
    days: 14
    payment_required: false
  deployment_note: Compass is available on Atlassian Cloud only; there is no Data Center option.
api_metering:
  metered: false
  note: >
    Neither the REST nor the GraphQL API is priced by request. The only published call-rate ceiling
    is the 100 requests per user per minute limit on the metrics and events endpoints (see
    rate-limits/), which applies on every tier.
plans:
- id: free
  name: Free
  price: '0.00'
  currency: USD
  period: month
  unit: full user
  description: For small teams looking to kickstart their Internal Developer Platform.
  limits:
    full_users: 3
    basic_users: unlimited
    components: unlimited
    custom_fields_and_scorecards: 3
    custom_component_types: null
    custom_metrics: null
    data_retention: not stated
  includes:
  - Software component catalog with unlimited services
  - Health scorecards and metrics
  - Apps and integrations
  - Integrations with Jira, Jira Service Management, Bitbucket and Opsgenie
  support: community
- id: standard
  name: Standard
  price: '7.67'
  currency: USD
  period: month
  unit: full user
  description: For growing teams looking to improve their developer experience and operational
    readiness.
  limits:
    full_users: 35000
    basic_users: unlimited
    custom_component_types: 3
    custom_fields_and_scorecards: 50
    custom_metrics: 100
    data_retention: 1 year for metrics, events and scorecard scores; catalog data unlimited
  includes:
  - Everything in Free
  - Operations - on-call schedules and alert routing across 150+ integrations
  - Integrations with Jira, Jira Service Management, Bitbucket and Opsgenie
  support: 9/5 regional support, 2-hour response for critical issues
- id: premium
  name: Premium
  price: '23.96'
  currency: USD
  period: month
  unit: full user
  description: For large orgs looking to scale their IDP with advanced compliance, support, and data
    features.
  limits:
    full_users: 35000
    basic_users: unlimited
    custom_component_types: 14
    custom_fields_and_scorecards: 100
    custom_metrics: 200
    data_retention: 2 years for metrics, events and scorecard scores; catalog data unlimited
  includes:
  - Everything in Standard
  - Enhanced operations - advanced integrations, escalation and notification policies, voice
    notifications, heartbeat monitoring
  - IP allowlisting
  - Granular permissions
  sla:
    uptime: 99.9%
    credits: financially backed with service level credits
  support: 24/7 support for critical issues, 1-hour response time
notes:
- Atlassian distinguishes "full users" (billable, full feature access) from "basic users" (free
  Atlassian account, limited feature set); basic users are unlimited on every tier.
- Atlassian Guard is a separate add-on product and is not part of a Compass plan.
- No Enterprise tier is published on the Compass pricing page.
- Compass is being phased out into DX Fabric (see lifecycle/); pricing was still published and
  self-serve purchasable on the date of this probe.
