event_sources:
  concept: >
    An event source represents a tool connected to Compass that supplies events to a component's
    activity feed. Compass identifies an event source uniquely by (externalEventSourceId,
    eventType), so one repository emitting both build and deployment events needs two event sources.
  graphql_mutations:
  - compass.createEventSource
  - compass.attachEventSource
  - compass.detachEventSource
  - compass.deleteEventSource
  docs: https://developer.atlassian.com/cloud/compass/components/send-events-using-rest-api-with-event-sources/
