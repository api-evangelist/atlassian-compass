    carries: environment (CompassDeploymentEventEnvironmentInputDto), pipeline
      (CompassDeploymentEventPipelineInputDto)
  - name: build
    schema: CompassCreateBuildEventInputDto
    properties_schema: CompassBuildEventPropertiesInputDto
    carries: pipeline (CompassBuildEventPipelineInputDto)
  - name: incident
    schema: CompassCreateIncidentEventInputDto
    properties_schema: CompassCreateIncidentEventPropertiesInputDto
    carries: severity (CompassIncidentEventSeverityInputDto)
  - name: alert
    schema: CompassCreateAlertEventInputDto
    properties_schema: CompassAlertEventPropertiesInputDto
  - name: flag
    schema: CompassCreateFlagEventInputDto
    properties_schema: CompassCreateFlagEventPropertiesInputDto
  - name: lifecycle
    schema: CompassCreateLifecycleEventInputDto
    properties_schema: CompassLifecycleEventInputPropertiesDto
  - name: push
    schema: CompassCreatePushEventInputDto
    properties_schema: CompassPushEventInputPropertiesDto
    carries: author (CompassPushEventAuthorInputDto)
  - name: pullRequest
    schema: CompassCreatePullRequestEventInputDto
    properties_schema: CompassPullRequestInputPropertiesDto
  - name: vulnerability
    schema: CompassCreateVulnerabilityEventInputDto
    properties_schema: CompassCreateVulnerabilityEventPropertiesInputDto
    carries: severity (CompassVulnerabilityEventSeverityInputDto)
  - name: custom
