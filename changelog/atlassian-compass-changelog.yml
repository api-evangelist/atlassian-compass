entries:
- date: '2026-06-18'
  type: Announcement
  title: Partner Security Incident Response Program
  breaking: false
  highlights:
  - Atlassian can share incident-scoped platform logs and app telemetry with partners during an
    investigation.
  - A single reporting path for security incidents through the developer support portal form.
  - Partners must keep security contact information current in the partner account.
- date: '2026-05-28'
  type: Announcement
  title: Updated Marketplace cloud app security SLOs and new enforcement policy
  breaking: false
  highlights:
  - Cloud app remediation SLOs shortened, enforceable from 2026-09-01 - Critical 10 days, High 4
    weeks, Medium 12 weeks, Low 25 weeks.
  - Data Center app SLOs unchanged - Critical 12 weeks, High 12 weeks, Medium 12 weeks, Low 25 weeks.
  - A consolidated Marketplace Security Enforcement Policy was published covering vulnerability
    management, OAuth compliance, partner verification, bug bounty participation and incident
    response.
- date: '2026-05-25'
  type: Added
  title: Tile component available in Preview for Forge UI Kit
  breaking: false
  highlights:
  - Rounded square container for assets such as emojis and objects, sizes 16px to 48px, design-token
    background colors, optional borders and adjustable padding.
