source: live HTTPS probes of every host this record knows (registrable domain + www, each apis.yml
  baseURL host, every OpenAPI servers[] host, the docs host, the auth host named by the OpenAPI
  securityScheme tokenUrl, and the MCP host named in the Atlassian Rovo MCP Server documentation)
note: >
  Atlassian serves a PGP-signed RFC 9116 security.txt from every host probed, including the API
  gateway and the MCP host. auth.atlassian.com (the tokenUrl/authorizationUrl host declared in the
  Compass OpenAPI oauth2 securityScheme) serves both OpenID Connect discovery and RFC 8414 OAuth
  authorization-server metadata. mcp.atlassian.com (the official Atlassian Rovo MCP Server, which
  documents Compass as a supported product) serves RFC 8414 authorization-server metadata with a
  dynamic client registration endpoint, and RFC 9728 protected-resource metadata at the
  path-scoped location /.well-known/oauth-protected-resource/v2/mcp. No /.well-known/api-catalog,
  ai-plugin.json, or A2A agent card is served on any host - every probe returned 404.
