note: 'Atlassian serves a PGP-signed RFC 9116 security.txt from every host probed, including the API gateway
  and the MCP host. auth.atlassian.com (the tokenUrl/authorizationUrl host declared in the Compass OpenAPI
  oauth2 securityScheme) serves both OpenID Connect discovery and RFC 8414 OAuth authorization-server
  metadata. mcp.atlassian.com (the official Atlassian Rovo MCP Server, which documents Compass as a supported
  product) serves RFC 8414 authorization-server metadata with a dynamic client registration endpoint,
  and RFC 9728 protected-resource metadata at the path-scoped location /.well-known/oauth-protected-resource/v2/mcp.
  No /.well-known/api-catalog, ai-plugin.json, or A2A agent card is served on any host - every probe returned
  404.



  MCP-host OAuth discovery added 2026-09-19 (roadmap#321/#337): the harvest visits a provider''s primary
  hosts, and RFC 9728 protected-resource metadata lives on the MCP host, so these documents existed and
  were invisible to the scorer. Fetched live and validated on `resource`/`issuer`; one negative control
  per host.'
