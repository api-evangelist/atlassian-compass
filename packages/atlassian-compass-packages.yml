note: >
  Atlassian publishes no Compass-branded client SDK on any registry. The first-party libraries a
  Compass integrator actually installs are Forge platform packages that the Compass documentation
  itself directs you to: the GraphQL API toolkit (@atlassian/forge-graphql), which the Compass docs
  describe as providing "API methods only for Compass", and the Forge CLI (@forge/cli), which the
  Compass getting-started guide requires before you can create or deploy a Compass app. Both are
  published by Atlassian and are marked official on that basis. Probes for @atlassian/compass-cli,
  compass-cli and @atlassian/compass-common all returned "Not found" on the npm registry.
