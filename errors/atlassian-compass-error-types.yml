method: searched
source: https://developer.atlassian.com/cloud/compass/error-handling/error-types/
description: >
  Atlassian's published Compass error-type registry. These are the stable machine-readable codes
  returned by Compass GraphQL queries and mutations - Atlassian states explicitly that the message
  text "may change over time" while the errorType "will not change over time", which makes this the
  code set an agent should branch on. Captured verbatim from the provider's error guide; nothing
  here is derived or inferred.
format: vendor-specific
rfc9457: false
envelopes:
- surface: GraphQL query
  shape: >
    Errors arrive inside a QueryError object on the requested field, carrying message and an
    extensions array whose entries hold statusCode (HTTP status) and errorType (stable code).
  example: |
    {"data":{"compass":{"component":{"__typename":"QueryError",
      "message":"Component not found",
      "extensions":[{"statusCode":404,"errorType":"COMPONENT_NOT_FOUND"}]}}}}
- surface: GraphQL mutation
  shape: >
    Errors arrive in the mutation payload object under success:false and an errors array, each entry
    carrying message and an extensions object with statusCode and errorType.
  example: |
    {"data":{"compass":{"updateComponent":{"success":false,
      "errors":[{"message":"...","extensions":{"statusCode":400,"errorType":"COMPONENT_ARI_INVALID"}}],
      "componentDetails":null}}}}
- surface: REST
  shape: >
    Error responses return an errors array of {type, message} objects. The REST contract's own
    narrative gives the canonical example.
  example: |
    {"errors":[{"type":"FORMAT_INVALID","message":"Field [value] is invalid."}]}
  source: https://developer.atlassian.com/cloud/compass/swagger.v3.json
