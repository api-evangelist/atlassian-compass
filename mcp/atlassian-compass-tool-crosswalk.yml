source: openapi/atlassian-compass-compass-rest-api-openapi.json, mcp/atlassian-compass-mcp.yml,
  graphql/atlassian-compass-introspection.json
note: >
  Compass has three non-identical projections of one data core, and they barely overlap. The REST
  contract is an ingestion and attachment surface only - 11 operations, none of which create, read
  or relate components. Everything catalog-shaped (components, scorecards, relationships, custom
  fields, teams) lives in the Atlassian platform GraphQL gateway. The MCP surface reaches Compass
  components through generic Teamwork Graph tools rather than Compass-named tools. Because the live
  MCP tools/list is OAuth-gated (HTTP 401 anonymously), every binding below is mapped by documented
  name and semantics, not by a fetched inputSchema, and confidence is set accordingly. Nothing here
  was invented to fill a row.
surfaces:
  openapi:
    file: openapi/atlassian-compass-compass-rest-api-openapi.json
    source: https://developer.atlassian.com/cloud/compass/swagger.v3.json
    server: https://your-domain.atlassian.net/gateway/api
    operations: 11
    gated: false
  graphql:
    endpoint: https://api.atlassian.com/graphql
    introspection: graphql/atlassian-compass-introspection.json
    docs: https://developer.atlassian.com/cloud/compass/graphql/
    gated: true
    gated_note: the gateway requires an authenticated Atlassian token; the captured introspection
      document is the platform-wide schema, not a Compass-only schema
  mcp:
    url: https://mcp.atlassian.com/v2/mcp
    gated: true
    gated_note: tools/list returns 401 invalid_token anonymously; tool inputSchemas require
      authenticated introspection
