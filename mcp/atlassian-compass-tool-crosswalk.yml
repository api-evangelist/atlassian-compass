graphql_only:
  note: >
    The whole Compass catalog CRUD surface - createComponent, updateComponent, deleteComponent,
    scorecards, custom fields, external aliases, teams - exists only in GraphQL. It is neither in
    the REST contract nor named as a Compass MCP tool. The published error-type registry
    (errors/atlassian-compass-error-types.yml) enumerates roughly 75 GraphQL error codes covering
    these operations, which is the strongest public evidence of that surface's shape.
